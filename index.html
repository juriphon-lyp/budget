<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>บันทึกรายรับรายจ่าย</title>

    <script src="js/budget.js" defer></script>
</head>

<body>

    <!-- ฟอร์มบันทึกรายการ -->
    <div>
        <form id="budgetform">

            <label for="itemName">รายการ:</label>
            <input type="text" id="itemName" name="itemName"
                required maxlength="50" placeholder="กรอกชื่อรายการ">

            <br><br>

            <label for="amount">จำนวนเงิน:</label>
            <input type="number" id="amount" name="amount"
                required step="1" min="1" placeholder="กรอกจำนวนเงิน">

            <br><br>

            <label for="date">วันที่ :</label>
            <input type="date" id="date" name="date" required>

            <br><br>

            <label for="time">เวลา :</label>
            <input type="time" id="time" name="time">

            <br><br>

            <label>ประเภท:</label>

            <input type="radio" id="income" name="type"
                value="income" required>
            <label for="income">รายรับ</label>

            <input type="radio" id="expense" name="type"
                value="expense" required>
            <label for="expense">รายจ่าย</label>

            <br><br>

            <input type="submit" value="ตกลง">
            <input type="reset" value="ยกเลิก">

        </form>
    </div>

    <!-- รายรับ -->
    <div>
        <h3>ผลรายรับทั้งหมด</h3>
        <p id="totalIncome">ยอดรวมรายรับ: 0 บาท</p>
    </div>

    <!-- รายจ่าย -->
    <div>
        <h3>ผลรายจ่ายทั้งหมด</h3>
        <p id="totalExpense">ยอดรวมรายจ่าย: 0 บาท</p>
    </div>

    <!-- ยอดคงเหลือ -->
    <div>
        <h3>ผลยอดคงเหลือ</h3>
        <p id="totalBalance">ยอดคงเหลือ: 0 บาท</p>
    </div>

    <!-- รายการทั้งหมด -->
    <div>
        <h3>ผลรวมทั้งหมด</h3>
        <ul id="transactionList">
        </ul>
    </div>

</body>

</html>
